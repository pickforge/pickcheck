<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="PickCheck social card">
  <title>PickCheck social card</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" stroke="#F2F2F3" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="emberHalo">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0A0A0B"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="72" y="123" font-family="Geist Mono, JetBrains Mono, monospace" font-size="18" font-weight="500" fill="#6E6E75" letter-spacing="0.18em">PICKFORGE · STUDIO</text>
  <text x="66" y="312" font-family="Geist, Inter, Arial, sans-serif" font-size="140" font-weight="800" fill="#F2F2F3" letter-spacing="-0.035em">PickCheck</text>
  <text font-family="Geist, Inter, Arial, sans-serif" font-size="44" font-weight="500" fill="#F2F2F3" letter-spacing="-0.01em">
    <tspan x="72" y="382">Per-function complexity checks</tspan>
    <tspan x="72" y="434">for coding agents.</tspan>
  </text>
  <text x="72" y="557" font-family="Geist Mono, JetBrains Mono, monospace" font-size="22" font-weight="500" fill="#6E6E75">pickforge.dev</text>
  <text x="1128" y="557" text-anchor="end" font-family="Geist Mono, JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#6E6E75" fill-opacity="0.8" letter-spacing="0.18em">FORMERLY COMPLEXITY-GATE</text>

  <!-- mark geometry from pickcheck-mark-128.svg, scaled 4.6x without its tile -->
  <g transform="translate(656 13.8) scale(4.6)">
    <g stroke="#F2F2F3" stroke-width="2.6" stroke-linecap="square" fill="none">
      <path d="M30 48 V32 H46"/>
      <path d="M82 32 H98 V48"/>
      <path d="M30 80 V96 H46"/>
      <path d="M82 96 H98 V80"/>
    </g>
    <path d="M38 50 H50 L62 64 L50 78 H38 M62 64 H82" stroke="#F2F2F3" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
    <circle cx="86" cy="64" r="11" fill="url(#emberHalo)"/>
    <circle cx="86" cy="64" r="4.5" fill="#FF7A1A"/>
  </g>
</svg>
