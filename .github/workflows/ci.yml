name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo run -- check crates
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --fail-under-lines 94

  rust-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --all-targets

  rust-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --all-targets

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source /repo --config /repo/.gitleaks.toml
          --no-banner --redact --verbose

  osv-scanner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock

  corpus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/corpus
          key: corpus-${{ hashFiles('tests/corpus/manifest.json') }}
      - run: scripts/fetch-corpus.sh "$RUNNER_TEMP/corpus"
      - run: cargo test -p pickcheck-core --test corpus --release --locked -- --ignored
        env:
          PICKCHECK_CORPUS_DIR: ${{ runner.temp }}/corpus
